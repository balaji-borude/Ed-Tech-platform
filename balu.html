<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Security Thumbnail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100">

    <div id="loading" class="text-white text-lg animate-pulse">Generating your thumbnail...</div>

    <div id="image-container" class="hidden w-full max-w-7xl px-4 flex justify-center items-center rounded-lg">
        <img id="thumbnail-image" src="" alt="Cyber Security Thumbnail" class="w-full h-auto rounded-lg shadow-2xl transition-transform duration-300 transform hover:scale-105">
    </div>

    <script>
        // Self-contained, runnable code to generate and display the image
        const loadingElement = document.getElementById('loading');
        const imageContainer = document.getElementById('image-container');
        const imageElement = document.getElementById('thumbnail-image');

        async function generateImage() {
            // Prompt for the image generation
            const userPrompt = "A high-resolution, professional thumbnail image for a cybersecurity topic. The image should have a 16:9 aspect ratio and feature elements like a glowing digital lock icon, a stylized network grid, binary code, and a subtle silhouette of a hooded figure. The color palette should be dark, with accents of glowing futuristic blue, green, and purple. The overall theme should convey security, technology, and protection in the digital age.";

            // Payload for the API call
            const payload = {
                instances: {
                    prompt: userPrompt,
                    sampleCount: 1
                },
            };

            const apiKey = ""; // API key is automatically provided by the Canvas environment
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-002:predict?key=${apiKey}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`API call failed with status: ${response.status}`);
                }

                const result = await response.json();
                const base64Data = result?.predictions?.[0]?.bytesBase64Encoded;

                if (base64Data) {
                    const imageUrl = `data:image/png;base64,${base64Data}`;
                    imageElement.src = imageUrl;
                    loadingElement.classList.add('hidden');
                    imageContainer.classList.remove('hidden');
                } else {
                    loadingElement.textContent = "Failed to generate image. Please try again.";
                    console.error("No image data found in the API response.");
                }
            } catch (error) {
                loadingElement.textContent = "An error occurred. Please check the console for details.";
                console.error("Error during image generation:", error);
            }
        }

        // Generate the image when the page loads
        window.onload = generateImage;
    </script>

</body>
</html>
